import java.text.SimpleDateFormat

plugins {
	id 'fml-loom' version '0.1'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

static def buildTime() {
	def df = new SimpleDateFormat("yyyyMMddHHmm")
	df.setTimeZone(TimeZone.getTimeZone("GMT+8"))
	return df.format(new Date())
}

base {
	archivesName = project.archives_base_name + "-dev-build." + buildTime()
//	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven {
		name = "Spongepowered"
		url = "https://repo.spongepowered.org/repository/maven-public/"
	}
	maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
	fml
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

}

def fmlResolvedFile = configurations.fml.files.iterator().next()


loom {
	accessWidenerPath = file("src/main/resources/shadersmodcore.accesswidener")
	mergedMinecraftJar()
	mods {
		"ShadersModCore" {
			sourceSet sourceSets.main
		}
	}
    runs {
        client {
            programArgs "--userProperties", "{}", "--username", "Dev", "--session", "a.a.a.a", "--width", "1920", "--height", "1080"
        }
    }
}

loom.setFML(fmlResolvedFile)
dependencies.add("mappings", loom.fmlMCPMappings())

processResources {
	inputs.property "version", project.version

	filesMatching("fml.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

tasks.register("smartAnimationsTest", JavaExec) {
	group = "verification"
	description = "Runs the Smart Animations state-machine fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.shader.SmartAnimationsTest"
}

tasks.register("dynamicLightQueryCacheTest", JavaExec) {
	group = "verification"
	description = "Runs the dynamic-light query cache fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.dynamicLight.DynamicLightQueryCacheTest"
}

tasks.register("dynamicLightBoundaryTest", JavaExec) {
	group = "verification"
	description = "Runs the dynamic-light maximum-brightness boundary fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.dynamicLight.DynamicLightBoundaryTest"
}

tasks.register("dynamicLightRevisionTest", JavaExec) {
	group = "verification"
	description = "Runs the dynamic-light revision invalidation fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.dynamicLight.DynamicLightRevisionTest"
}

tasks.register("dynamicLightScanTest", JavaExec) {
	group = "verification"
	description = "Runs the allocation-free dynamic-light scan fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.dynamicLight.DynamicLightScanTest"
}

tasks.register("shadersTexResourcePathTest", JavaExec) {
	group = "verification"
	description = "Runs the shader texture resource-path fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.shader.ShadersTexResourcePathTest"
}

tasks.register("configParsingTest", JavaExec) {
	group = "verification"
	description = "Runs the configuration parsing fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.config.ConfigParsingTest"
}

tasks.register("particleRenderOptimizerTest", JavaExec) {
	group = "verification"
	description = "Runs the empty regular-particle render fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.client.optimize.ParticleRenderOptimizerTest"
}

tasks.register("tessellatorBufferGrowthTest", JavaExec) {
	group = "verification"
	description = "Runs the per-instance tessellator buffer growth fixture."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "shadersmodcore.util.TessellatorBufferGrowthTest"
}

tasks.named("test") {
	dependsOn "smartAnimationsTest"
	dependsOn "dynamicLightQueryCacheTest"
	dependsOn "dynamicLightBoundaryTest"
	dependsOn "dynamicLightRevisionTest"
	dependsOn "dynamicLightScanTest"
	dependsOn "shadersTexResourcePathTest"
	dependsOn "configParsingTest"
	dependsOn "particleRenderOptimizerTest"
	dependsOn "tessellatorBufferGrowthTest"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	    maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
	}
}
